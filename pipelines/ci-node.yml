# resumo: CI Node (Next.js ou Astro) no padrão dos sites - audit, format, lint, tipos, cobertura 80%, build, E2E com Playwright e revisão de dependências.
# Copie para .github/workflows/ci.yml. Requer .nvmrc, package-lock.json e os scripts format:check, lint, typecheck, test:coverage, build, test:e2e.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=moderate

      - name: Formatação
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Testes com cobertura (mínimo 80%)
        run: npm run test:coverage

      - name: Build
        run: npm run build
        # env: variáveis públicas que o build dos testes precisa (ex.: SITE_URL do servidor local de E2E)

      - name: Instalar Chromium para os testes E2E
        run: npx playwright install --with-deps chromium

      - name: Testes E2E e acessibilidade (axe)
        run: npm run test:e2e

      - name: Publicar relatório E2E
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  dependency-review:
    name: Revisão de dependências
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          # Ferramentas de desenvolvimento não chegam ao site publicado.
          fail-on-scopes: runtime
          deny-licenses: GPL-3.0, AGPL-3.0
